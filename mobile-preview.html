<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기</title>
<style>
  body{margin:0;background:#e9e4da;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  .stage{display:flex;gap:28px;padding:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  .phone{width:390px;border-radius:44px;background:#0e1b2c;padding:12px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
  .screen{width:390px;height:844px;border-radius:34px;overflow:hidden;background:#fff;position:relative}
  .screen iframe{width:390px;height:844px;border:0;display:block}
  .label{text-align:center;font-size:12px;color:#4a5563;padding:10px 0 0}
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="phone"><div class="screen"><iframe src="/seoul-pickup/?v=10" title="mobile top"></iframe></div></div>
    <div class="label">390 × 844 (상단)</div>
  </div>
  <div>
    <div class="phone"><div class="screen"><iframe src="/seoul-pickup/?v=10#price" title="mobile price"></iframe></div></div>
    <div class="label">390 × 844 (요금·매장)</div>
  </div>
</div>
<script>
  window.addEventListener('load', function () {
    var frames = document.querySelectorAll('iframe');
    if (frames[1]) {
      var d = frames[1].contentDocument;
      var t = d.getElementById('price');
      if (t) frames[1].contentWindow.scrollTo(0, t.offsetTop - 8);
    }
  });
</script>
</body>
</html>
